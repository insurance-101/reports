<title>기동현 | 토스인슈어런스 보험상담</title>
<meta property="og:title" content="기동현 보험상담사 · 토스인슈어런스">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--blue:#0064FF;--blue2:#3182F6;--blue-deep:#0046b8;--ink:#191F28;--gray:#4E5968;
    --gray2:#8B95A1;--line:#E5E8EB;--bg:#fff;--bg2:#F2F4F6;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{font-family:'Pretendard',-apple-system,system-ui,sans-serif;background:var(--bg2);
    color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:460px;margin:0 auto;background:var(--bg);min-height:100vh;
    box-shadow:0 0 60px rgba(0,0,0,.06);overflow:hidden;padding-bottom:84px;}
  section{padding:34px 22px;}
  .eyebrow{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.4px;margin-bottom:8px;}
  h2.sec{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-bottom:18px;}
  .reveal{opacity:0;transform:translateY(18px);transition:.7s cubic-bezier(.2,.7,.2,1);}
  .reveal.in{opacity:1;transform:none;}

  /* HERO */
  .hero{position:relative;background:radial-gradient(120% 80% at 80% 0%, #3182F6 0%, #0064FF 45%, #003ea8 100%);
    color:#fff;padding:30px 22px;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);}
  .brand{display:flex;align-items:center;margin-bottom:22px;position:relative;z-index:1;}
  .brand img{height:22px;width:auto;display:block;
    filter:drop-shadow(0 1px 4px rgba(0,18,64,.28));}
  .hgrid{display:flex;gap:16px;align-items:center;position:relative;z-index:1;}
  .htxt{flex:1;min-width:0;}
  .htxt .role{font-size:13px;font-weight:600;color:#cfe0ff;margin-bottom:9px;}
  .htxt .nm{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:0 0 14px;}
  .htxt .pos{display:inline-block;font-size:13px;font-weight:700;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;}
  .portrait{width:104px;height:138px;border-radius:16px;object-fit:cover;flex:none;
    box-shadow:0 12px 30px rgba(0,20,80,.35);border:2px solid rgba(255,255,255,.25);}
  .slogan{position:relative;z-index:1;margin-top:22px;font-size:17px;font-weight:700;line-height:1.5;letter-spacing:-.4px;}
  .slogan b{color:#bcd6ff;}
  .qc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1;margin-top:24px;}
  .qc a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 6px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.18);border-radius:14px;color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;transition:.15s;}
  .qc a:active{transform:scale(.96);background:rgba(255,255,255,.24);}
  .qc .ic{width:22px;height:22px;}

  /* 명함 */
  .cards-sec{background:var(--bg2);}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;}
  .seg button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--gray2);
    padding:8px 18px;border-radius:9px;cursor:pointer;transition:.15s;}
  .seg button.on{background:var(--blue);color:#fff;}
  .namecard{display:none;}
  .namecard.show{display:block;animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .namecard img{width:100%;border-radius:16px;box-shadow:0 10px 30px rgba(0,20,80,.12);border:1px solid var(--line);display:block;}
  .cardnote{font-size:12px;color:var(--gray2);margin-top:12px;text-align:center;}

  /* 자격증 리스트 */
  .lic-sec{background:#fff;}
  .lic{margin-bottom:14px;background:linear-gradient(150deg,#fff 0%,#f4f8ff 100%);border:1px solid #dce6f7;
    border-radius:18px;box-shadow:0 6px 18px rgba(0,30,90,.07);padding:18px;cursor:pointer;transition:.18s;}
  .lic:active{transform:scale(.985);box-shadow:0 3px 10px rgba(0,30,90,.1);}
  .lf-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .org-tag{font-size:11px;font-weight:700;color:var(--blue);background:#EBF2FF;padding:5px 10px;border-radius:8px;}
  .foil{width:48px;height:48px;border-radius:11px;flex:none;
    background:conic-gradient(from 0deg,#cfe0ff,#7fa9ff,#fff,#9cc0ff,#e3edff,#bcd2ff,#fff,#cfe0ff);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 3px 8px rgba(0,60,160,.2);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .foil::after{content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.9) 48%,transparent 62%);
    transform:translateX(-120%);animation:sheen 3.8s ease-in-out infinite;}
  @keyframes sheen{0%,100%{transform:translateX(-120%)}44%,56%{transform:translateX(120%)}}
  .foil b{font-size:12.5px;font-weight:900;color:var(--blue-deep);position:relative;z-index:1;}
  .lf-name{font-size:21px;font-weight:800;letter-spacing:-.6px;margin-top:15px;color:#0a1c3d;}
  .lf-kind{font-size:12.5px;color:var(--gray);font-weight:600;margin-top:3px;}
  .lf-meta{margin-top:14px;display:flex;justify-content:flex-end;align-items:flex-end;
    padding-top:13px;border-top:1px solid var(--line);}
  .lf-meta .l{font-size:11px;color:var(--gray2);}
  .lf-meta .l b{display:block;font-size:13.5px;color:var(--ink);font-weight:700;margin-top:2px;}
  .lf-meta .tap{font-size:12px;color:var(--blue);font-weight:700;}

  /* ===== MODAL (강화) ===== */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    overflow-y:auto;padding:5vh 0;}
  .modal.open{display:flex;}
  .modal-bg{position:fixed;inset:0;background:rgba(6,14,32,.66);opacity:0;transition:.3s;backdrop-filter:blur(3px);}
  .modal.open .modal-bg{opacity:1;}
  .modal-card{position:relative;width:100%;max-width:430px;padding:0 16px;margin-bottom:9vh;
    transform:translateY(46px) scale(.9);opacity:0;
    transition:transform .46s cubic-bezier(.18,.89,.32,1.27), opacity .34s ease;}
  .modal.open .modal-card{transform:none;opacity:1;}

  .cert{position:relative;border-radius:26px;overflow:hidden;background:#fff;
    box-shadow:0 30px 80px rgba(0,10,40,.5);}
  .cert::before{content:"";position:absolute;inset:0;border-radius:26px;padding:1.5px;pointer-events:none;
    background:linear-gradient(135deg,rgba(120,170,255,.9),rgba(0,100,255,0) 40%,rgba(0,100,255,0) 60%,rgba(120,170,255,.9));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;}
  /* header */
  .cert-hd{position:relative;overflow:hidden;color:#fff;padding:22px 22px 20px;
    background:linear-gradient(135deg,#3182F6,#0064FF 55%,#0046b8);}
  .cert-hd::after{content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.32) 50%,transparent 64%);
    transform:translateX(-130%);animation:hdSheen 3.6s ease-in-out infinite;}
  @keyframes hdSheen{0%,100%{transform:translateX(-130%)}46%,60%{transform:translateX(130%)}}
  .cert-hd .label{font-size:10.5px;letter-spacing:2.5px;font-weight:700;opacity:.82;}
  .cert-hd .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:6px;}
  .cert-hd .org{font-size:12.5px;font-weight:700;opacity:.92;}
  .cert-hd .nm{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:2px;}
  .foil2{width:60px;height:60px;border-radius:14px;flex:none;position:relative;overflow:hidden;z-index:1;
    background:conic-gradient(from 0deg,#eaf1ff,#9cc0ff,#fff,#bcd2ff,#fff,#9cc0ff,#eaf1ff);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 4px 12px rgba(0,40,120,.4);
    display:flex;align-items:center;justify-content:center;}
  .foil2::after{content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.95) 48%,transparent 62%);
    transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite;}
  .foil2 b{font-size:15px;font-weight:900;color:var(--blue-deep);z-index:1;}
  /* verified badge pop */
  .vbadge{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:11.5px;font-weight:700;
    background:rgba(255,255,255,.18);padding:5px 11px;border-radius:20px;
    transform:scale(0);animation:pop .5s cubic-bezier(.18,.89,.32,1.4) .25s forwards;}
  @keyframes pop{to{transform:scale(1)}}
  .vbadge svg{width:14px;height:14px;}
  /* body w/ guilloche */
  .cert-bd{position:relative;padding:20px 22px 4px;}
  .cert-bd::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(circle at 18% 20%, rgba(0,100,255,.05) 0 1px, transparent 1.5px),
      radial-gradient(circle at 50% 60%, rgba(0,100,255,.04) 0 1px, transparent 1.5px);
    background-size:16px 16px,22px 22px;}
  .holder{position:relative;display:flex;align-items:baseline;gap:9px;padding-bottom:13px;border-bottom:1px solid var(--line);}
  .holder .k{font-size:12px;color:var(--gray2);font-weight:600;}
  .holder .v{font-size:21px;font-weight:800;color:#0a1c3d;letter-spacing:-.4px;}
  .crow{position:relative;display:flex;justify-content:space-between;gap:14px;padding:11px 0;
    border-bottom:1px solid var(--line);font-size:13.5px;
    opacity:0;transform:translateY(8px);animation:rowIn .5s cubic-bezier(.2,.7,.2,1) forwards;}
  @keyframes rowIn{to{opacity:1;transform:none}}
  .crow .k{color:var(--gray);font-weight:500;flex:none;}
  .crow .v{color:var(--ink);font-weight:700;text-align:right;}
  .cert-ft{position:relative;padding:16px 22px 0;}
  .cert-ft .iss{font-size:11px;color:var(--gray2);}
  .cert-ft .iss b{display:block;font-size:15px;color:#0a1c3d;font-weight:800;margin-top:3px;letter-spacing:.5px;}
  .dlbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 22px 22px;
    padding:15px;border-radius:14px;background:var(--blue);color:#fff;text-decoration:none;
    font-weight:800;font-size:15px;box-shadow:0 8px 20px rgba(0,100,255,.3);transition:.15s;}
  .dlbtn:active{transform:scale(.97);}
  .dlbtn svg{width:18px;height:18px;}
  .mclose{margin:14px auto 0;display:block;width:48px;height:48px;border-radius:50%;border:none;background:#fff;
    color:var(--ink);font-size:25px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25);}

  /* 하단 다운로드 섹션 */
  .dl-sec{background:var(--bg2);}
  .dl-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--ink);transition:.15s;}
  .dl-item:active{transform:scale(.99);background:#f7faff;}
  .dl-item .di{width:38px;height:38px;border-radius:10px;background:#EBF2FF;flex:none;
    display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800;font-size:11px;}
  .dl-item .dt{flex:1;min-width:0;}
  .dl-item .dt b{display:block;font-size:14px;font-weight:700;}
  .dl-item .dt span{font-size:11.5px;color:var(--gray2);}
  .dl-item .dd{color:var(--blue);}
  .dl-item .dd svg{width:20px;height:20px;}
  .dlnote{font-size:11px;color:var(--gray2);margin-top:6px;line-height:1.5;}

  /* footer */
  footer{background:#0a1830;color:#aebfdc;padding:28px 22px 34px;font-size:12.5px;line-height:1.7;}
  footer .fnm{color:#fff;font-weight:800;font-size:15px;margin-bottom:10px;}
  footer .frow{display:flex;gap:8px;margin-top:3px;}
  footer .frow .k{color:#6f86b5;min-width:62px;flex:none;}
  footer a{color:#9cc4ff;text-decoration:none;}

  /* sticky */
  .sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:460px;margin:0 auto;display:flex;gap:10px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,0),#fff 30%);}
  .sticky a{flex:1;text-align:center;padding:15px;border-radius:14px;font-weight:800;font-size:15px;text-decoration:none;transition:.15s;}
  .sticky a:active{transform:scale(.97);}
  .sticky .call{background:var(--blue);color:#fff;flex:1.6;box-shadow:0 6px 18px rgba(0,100,255,.32);}
  .sticky .sms{background:var(--bg2);color:var(--ink);border:1px solid var(--line);}
  @media (prefers-reduced-motion:reduce){.foil::after,.foil2::after,.cert-hd::after{animation:none;}}

  /* ===== 자격증 카드 뒤집기 ===== */
  .flipwrap{position:relative;transform-style:preserve-3d;
    transition:transform .72s cubic-bezier(.2,.75,.25,1), height .5s cubic-bezier(.2,.7,.2,1);}
  .flipwrap.flipped{transform:rotateY(180deg);}
  .flipwrap .cert{position:absolute;top:0;left:0;width:100%;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .flipwrap .cert-back{transform:rotateY(180deg);}
  .flipbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 22px 22px;
    padding:15px;border-radius:14px;background:var(--blue);color:#fff;border:none;width:calc(100% - 44px);
    font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
    box-shadow:0 8px 20px rgba(0,100,255,.3);transition:.15s;}
  .flipbtn:active{transform:scale(.97);}
  .flipbtn svg{width:18px;height:18px;}
  .backhd{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 20px;background:linear-gradient(135deg,#3182F6,#0064FF 55%,#0046b8);color:#fff;}
  .backhd .bt{font-size:10.5px;letter-spacing:2.5px;font-weight:700;opacity:.82;}
  .backhd .bn{font-size:16px;font-weight:800;letter-spacing:-.4px;margin-top:3px;}
  .backimg{padding:14px 14px 0;}
  .backimg img{width:100%;display:block;border-radius:12px;border:1px solid var(--line);
    background:#fff;box-shadow:0 4px 14px rgba(0,20,80,.10);}
  .privacy{display:flex;align-items:center;gap:7px;margin:12px 14px 0;padding:10px 12px;
    background:#F2F6FF;border:1px solid #DCE6F7;border-radius:11px;
    font-size:11.5px;color:var(--gray);line-height:1.5;}
  .privacy svg{width:15px;height:15px;flex:none;color:var(--blue);}
  @media (prefers-reduced-motion:reduce){.flipwrap{transition:none;}}
</style>
</head>

  var flipWrap=document.getElementById('flipWrap'), certBack=document.getElementById('certBack');
  var ICON_EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';

  function fitH(){
    var face=flipWrap.classList.contains('flipped')?certBack:certBody;
    flipWrap.style.height=face.offsetHeight+'px';
  }
  window.addEventListener('resize',fitH);
  var ICON_CK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  // 리스트
  var list=document.getElementById('licList');
  CERTS.forEach(function(c,i){
    var el=document.createElement('div');
    el.className='lic';
    el.innerHTML='<div class="lf-top"><span class="org-tag">'+c.org+'</span><span class="foil"><b>'+c.foil+'</b></span></div>'+
      '<div class="lf-name">'+c.name+'</div><div class="lf-kind">'+c.kind+'</div>'+
      '<div class="lf-meta"><span class="tap">자격증 보기 →</span></div>';
    el.addEventListener('click',function(){openCert(i);});
    list.appendChild(el);
  });

  // 모달
  var modal=document.getElementById('modal'), certBody=document.getElementById('certBody');
  function openCert(i){
    var c=CERTS[i];
    var rows=c.rows.map(function(r,k){
      return '<div class="crow" style="animation-delay:'+(0.12+k*0.06)+'s"><span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span></div>';
    }).join('');
    certBody.innerHTML=
      '<div class="cert-hd"><div class="label">DIGITAL CERTIFICATE</div>'+
        '<div class="hrow"><div><div class="org">'+c.org+'</div><div class="nm">'+c.name+'</div></div>'+
          '<span class="foil2"><b>'+c.foil+'</b></span></div>'+
        '<span class="vbadge">'+ICON_CK+' 자격 보유 확인</span></div>'+
      '<div class="cert-bd"><div class="holder"><span class="k">성명</span><span class="v">'+c.holder+'</span></div>'+rows+'</div>'+
      '<div class="cert-ft"><div class="iss">발급기관<b>'+c.issuer+'</b></div></div>'+
      '<button class="flipbtn" data-flip="1">'+ICON_EYE+' 자격증 원본 보기</button>';
    certBack.innerHTML=
      '<div class="backhd"><div><div class="bt">ORIGINAL</div><div class="bn">'+c.name+'</div></div>'+
        '<span class="foil2"><b>원본</b></span></div>'+
      '<div class="backimg"><img src="'+c.img+'" alt="'+c.name+' 합격증 원본" style="aspect-ratio:'+c.ar+'"></div>'+

      '<button class="flipbtn" data-flip="0">'+ICON_BACK+' 자격 정보로 돌아가기</button>';
    flipWrap.classList.remove('flipped');
    modal.classList.add('open');document.body.style.overflow='hidden';
    fitH();
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest && e.target.closest('.flipbtn');
    if(!b) return;
    flipWrap.classList.toggle('flipped', b.dataset.flip==='1');
    fitH();
  });
  function closeCert(){modal.classList.remove('open');document.body.style.overflow='';flipWrap.classList.remove('flipped');}
  document.getElementById('modalBg').addEventListener('click',closeCert);
  document.getElementById('mClose').addEventListener('click',closeCert);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCert();});

  // 명함 토글
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');var t=b.dataset.card;
      document.getElementById('card-v').classList.toggle('show',t==='v');
      document.getElementById('card-h').classList.toggle('show',t==='h');
    });
  });

  // reveal
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.12});
  document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
